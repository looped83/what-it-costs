<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What it costs</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      width: 100%;
      max-width: 560px;
    }

    .hero-emoji {
      font-size: 2.4rem;
      text-align: center;
      margin-bottom: 0.4rem;
      line-height: 1;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 2rem;
      text-align: center;
    }

    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      background: #1e1e1e;
      border: 1.5px solid #444;
      border-radius: 8px;
      padding: 0.85rem 3rem 0.85rem 0.875rem;
      font-size: 1.05rem;
      color: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.03);
    }

    .input-wrap input::placeholder { color: #555; }

    .input-wrap input:focus {
      border-color: #888;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.07);
    }

    .input-wrap input.invalid {
      border-color: #c0392b;
      box-shadow: 0 0 0 3px rgba(192,57,43,0.15);
    }

    .reset-btn {
      position: absolute;
      right: 1.8rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #555;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      padding: 0.25rem 0.3rem;
      opacity: 0;
      pointer-events: none;
      transition: color 0.15s, opacity 0.15s;
    }

    .reset-btn:hover { color: #bbb; }

    .input-wrap input:not(:placeholder-shown) ~ .reset-btn {
      opacity: 1;
      pointer-events: auto;
    }

    .input-wrap .unit {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
      color: #fff;
      pointer-events: none;
    }

    .results {
      display: grid;
      gap: 0.75rem;
    }

    .result-block {
      position: relative;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      user-select: none;
    }

    .result-block:hover         { border-color: #3a3a3a; }
    .result-block.highlight     { background: #1a1600; border-color: #e8c96a44; }
    .result-block.highlight:hover { border-color: #e8c96a77; }

    .result-block .label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 0.4rem;
      transition: color 0.2s;
    }

    .result-block.copied .label { color: #6fcf97; }

    .result-block .value {
      font-size: clamp(1.6rem, 8vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #fff;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .result-block.highlight .value { color: #e8c96a; }
    .result-block .value.zero      { color: #444; }
  </style>
</head>
<body>
  <div class="card">
    <div class="hero-emoji">💸</div>
    <h1>What it costs</h1>

    <div class="inputs">
      <div class="field">
        <label for="price">Kaufsumme</label>
        <div class="input-wrap">
          <input id="price" type="text" inputmode="numeric"
                 placeholder="10.000" autocomplete="off" spellcheck="false" />
          <button class="reset-btn" type="button" aria-label="Kaufsumme zurücksetzen">×</button>
          <span class="unit" aria-hidden="true">€</span>
        </div>
      </div>
      <div class="field">
        <label for="yield">Dividendenrendite</label>
        <div class="input-wrap">
          <input id="yield" type="text" inputmode="decimal"
                 placeholder="z.B. 4,5" spellcheck="false" value="4" />
          <button class="reset-btn" type="button" aria-label="Dividendenrendite zurücksetzen">×</button>
          <span class="unit" aria-hidden="true">%</span>
        </div>
      </div>
    </div>

    <div class="results" role="status" aria-live="polite" aria-label="Berechnungsergebnisse">
      <div class="result-block" role="button" tabindex="0">
        <div class="label">Entgangene Dividende (1 Jahr)</div>
        <div class="value zero" id="r-annual">— €</div>
      </div>
      <div class="result-block" role="button" tabindex="0">
        <div class="label">Entgangene Dividende (20 Jahre)</div>
        <div class="value zero" id="r-annual20">— €</div>
      </div>
      <div class="result-block highlight" role="button" tabindex="0">
        <div class="label">Entgehendes Vermögen</div>
        <div class="value zero" id="r-wealth">— €</div>
      </div>
    </div>
  </div>

  <script>
    const priceInput = document.getElementById('price');
    const yieldInput = document.getElementById('yield');
    const resultsDiv = document.querySelector('.results');
    const els = {
      annual:   document.getElementById('r-annual'),
      annual20: document.getElementById('r-annual20'),
      wealth:   document.getElementById('r-wealth'),
    };
    const resultEls = Object.values(els);

    const fmt    = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmtInt = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 });

    function parsePrice(str) {
      return parseFloat(str.replace(/\./g, '').replace(',', '.'));
    }

    function parseYield(str) {
      return parseFloat(str.replace(',', '.'));
    }

    function setResult(el, value) {
      el.textContent = value !== null ? fmt.format(value) + ' €' : '— €';
      el.classList.toggle('zero', value === null);
    }

    function calculate() {
      const price    = parsePrice(priceInput.value);
      const divYield = parseYield(yieldInput.value);

      const priceOk = isFinite(price)    && price    > 0;
      const yieldOk = isFinite(divYield) && divYield > 0 && divYield <= 100;

      priceInput.classList.toggle('invalid', priceInput.value !== '' && !priceOk);
      yieldInput.classList.toggle('invalid', yieldInput.value !== '' && !yieldOk);

      if (!priceOk || !yieldOk) {
        resultEls.forEach(el => setResult(el, null));
        return;
      }

      const rate   = divYield / 100;
      const annual = price * rate;

      setResult(els.annual,   annual);
      setResult(els.annual20, price * ((1 + rate) ** 20 - 1));
      setResult(els.wealth,   price / rate);
    }

    // Price: live thousand-separator formatting
    priceInput.addEventListener('input', () => {
      const num = parsePrice(priceInput.value);
      if (isFinite(num) && num > 0) {
        const cursor  = priceInput.selectionStart;
        const prevLen = priceInput.value.length;
        priceInput.value = fmtInt.format(num);
        const pos = cursor + (priceInput.value.length - prevLen);
        priceInput.setSelectionRange(pos, pos);
      }
      calculate();
    });

    // Yield: allow digits plus a single comma or dot as decimal separator
    yieldInput.addEventListener('input', () => {
      let val = yieldInput.value.replace(/[^\d,.]/g, '');
      const sep = val.search(/[,.]/);
      if (sep !== -1) {
        val = val.slice(0, sep + 1) + val.slice(sep + 1).replace(/[,.]/g, '');
      }
      if (yieldInput.value !== val) yieldInput.value = val;
      calculate();
    });

    // Reset buttons
    document.querySelectorAll('.reset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.closest('.input-wrap').querySelector('input');
        input.value = '';
        input.focus();
        calculate();
      });
    });

    // Copy result on click / keyboard
    document.querySelectorAll('.result-block').forEach(block => {
      function copy() {
        const valueEl = block.querySelector('.value');
        if (valueEl.classList.contains('zero') || block.classList.contains('copied')) return;

        navigator.clipboard.writeText(valueEl.textContent).then(() => {
          const label = block.querySelector('.label');
          const orig  = label.textContent;

          // Silence aria-live during transient feedback
          resultsDiv.setAttribute('aria-live', 'off');
          block.classList.add('copied');
          label.textContent = 'Kopiert ✓';

          setTimeout(() => {
            block.classList.remove('copied');
            label.textContent = orig;
            resultsDiv.setAttribute('aria-live', 'polite');
          }, 1500);
        });
      }

      block.addEventListener('click', copy);
      block.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copy(); }
      });
    });

    calculate();
  </script>
</body>
</html>
