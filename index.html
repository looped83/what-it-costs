<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What it costs</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      width: 100%;
      max-width: 560px;
    }

    .hero-emoji {
      font-size: 2.8rem;
      text-align: center;
      margin-bottom: 0.6rem;
      line-height: 1;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 3rem;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 0.75rem 2rem 0.75rem 0.875rem;
      font-size: 1rem;
      color: #f0f0f0;
      outline: none;
      transition: border-color 0.15s;
    }

    .input-wrap input:focus {
      border-color: #555;
    }

    .input-wrap .unit {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
      color: #fff;
      pointer-events: none;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .result-block {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 1.75rem 1.5rem;
      text-align: center;
    }

    .result-block.highlight {
      background: #1a1600;
      border-color: #e8c96a44;
    }

    .result-block .label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 0.6rem;
    }

    .result-block .value {
      font-size: clamp(1.6rem, 8vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #fff;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .result-block.highlight .value {
      color: #e8c96a;
    }

    .result-block .value.zero {
      color: #444;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="hero-emoji">💸</div>
    <h1>What it costs</h1>

    <div class="inputs">
      <div class="field">
        <label>Kaufsumme</label>
        <div class="input-wrap">
          <input id="price" type="text" inputmode="numeric" placeholder="10.000" autocomplete="off" />
          <span class="unit">€</span>
        </div>
      </div>
      <div class="field">
        <label>Dividendenrendite</label>
        <div class="input-wrap">
          <input id="yield" type="number" min="0" max="100" step="0.1" value="4" />
          <span class="unit">%</span>
        </div>
      </div>
    </div>

    <div class="results">
      <div class="result-block">
        <div class="label">Entgangene jährliche Dividende</div>
        <div class="value zero" id="annual">— €</div>
      </div>
      <div class="result-block highlight">
        <div class="label">Entgehendes Vermögen</div>
        <div class="value zero" id="wealth">— €</div>
      </div>
    </div>
  </div>

  <script>
    const priceInput = document.getElementById('price');
    const yieldInput = document.getElementById('yield');
    const annualEl  = document.getElementById('annual');
    const wealthEl  = document.getElementById('wealth');

    const fmt = new Intl.NumberFormat('de-DE', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    });

    const fmtInt = new Intl.NumberFormat('de-DE', {
      minimumFractionDigits: 0,
      maximumFractionDigits: 0,
    });

    function getRawPrice() {
      // Strip thousand separators (.) and replace decimal comma with dot
      return parseFloat(priceInput.value.replace(/\./g, '').replace(',', '.'));
    }

    priceInput.addEventListener('input', () => {
      const raw = priceInput.value.replace(/\./g, '').replace(',', '.');
      const num = parseFloat(raw);
      if (isFinite(num) && num > 0) {
        const cursor = priceInput.selectionStart;
        const prevLen = priceInput.value.length;
        priceInput.value = fmtInt.format(num);
        // Adjust cursor for added/removed separator dots
        const diff = priceInput.value.length - prevLen;
        priceInput.setSelectionRange(cursor + diff, cursor + diff);
      }
      calculate();
    });

    yieldInput.addEventListener('input', calculate);

    function calculate() {
      const price    = getRawPrice();
      const divYield = parseFloat(yieldInput.value);

      if (!isFinite(price) || !isFinite(divYield) || price <= 0 || divYield <= 0) {
        annualEl.textContent = '— €';
        wealthEl.textContent = '— €';
        annualEl.classList.add('zero');
        wealthEl.classList.add('zero');
        return;
      }

      const rate   = divYield / 100;
      const annual = price * rate;
      const wealth = price / rate;

      annualEl.textContent = fmt.format(annual) + ' €';
      wealthEl.textContent = fmt.format(wealth) + ' €';
      annualEl.classList.remove('zero');
      wealthEl.classList.remove('zero');
    }

    calculate();
  </script>
</body>
</html>
