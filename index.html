<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#000000" />
  <title>What it costs</title>
  <meta name="description" content="Berechne, was ein Kauf wirklich kostet – entgangene Dividende pro Jahr, über 20 Jahre und das benötigte Investitionskapital." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>" />
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #f0f0f0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      width: 100%;
      max-width: 560px;
    }

    .hero-emoji {
      font-size: 2.4rem;
      text-align: center;
      margin-bottom: 0.4rem;
      line-height: 1;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 2rem;
      text-align: center;
    }

    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 340px) {
      .inputs { grid-template-columns: 1fr; }
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .input-wrap { position: relative; }

    .input-wrap input {
      width: 100%;
      background: #1e1e1e;
      border: 1.5px solid #444;
      border-radius: 8px;
      padding: 0.85rem 2rem 0.85rem 0.875rem;
      font-size: 1.05rem;
      color: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.03);
    }

    .input-wrap input::placeholder { color: #999; opacity: 1; }

    .input-wrap input:focus {
      border-color: #888;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.07);
    }

    .input-wrap input.invalid {
      border-color: #e74c3c;
      box-shadow: 0 0 0 3px rgba(231,76,60,0.2);
    }

    .input-wrap input.invalid:focus {
      box-shadow: 0 0 0 3px rgba(231,76,60,0.5);
    }

    .input-wrap .unit {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
      color: #fff;
      pointer-events: none;
    }

    .results {
      display: grid;
      gap: 0.75rem;
      contain: layout style;
    }

    .result-block {
      position: relative;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      user-select: none;
    }

    .result-block:hover            { border-color: #3a3a3a; }
    .result-block:focus-visible    { outline: 2px solid #888; outline-offset: 2px; }
    .result-block.highlight        { background: #1a1600; border-color: #e8c96a44; }
    .result-block.highlight:hover  { border-color: #e8c96a77; }

    .result-block .label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 0.4rem;
      transition: color 0.2s;
    }

    .result-block.copied .label { color: #6fcf97; }

    .result-block .value {
      font-size: clamp(1.6rem, 8vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #fff;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .result-block.highlight .value { color: #e8c96a; }
    .result-block .value.zero      { color: #777; }

    .reset-all {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      margin: 0.25rem auto 0;
      background: none;
      border: none;
      color: #888;
      font-family: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0 0.75rem;
      transition: color 0.15s;
    }

    .reset-all:hover        { color: #aaa; }
    .reset-all:focus-visible { outline: 2px solid #888; outline-offset: 2px; }

    @media (forced-colors: active) {
      .input-wrap input:focus        { outline: 2px solid ButtonText; outline-offset: 2px; }
      .input-wrap input.invalid      { outline: 2px solid Highlight; }
      .input-wrap input.invalid:focus { outline: 3px solid ButtonText; outline-offset: 2px; }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="hero-emoji" aria-hidden="true">💸</div>
    <h1 lang="en">What it costs</h1>

    <div class="inputs">
      <div class="field">
        <label for="price">Kaufsumme<span class="sr-only"> (€)</span></label>
        <div class="input-wrap">
          <input id="price" type="text" inputmode="decimal"
                 placeholder="10.000" autocomplete="off" spellcheck="false" />
          <span class="unit" aria-hidden="true">€</span>
        </div>
      </div>
      <div class="field">
        <label for="yield">Dividendenrendite<span class="sr-only"> (%)</span></label>
        <div class="input-wrap">
          <input id="yield" type="text" inputmode="decimal"
                 placeholder="z.B. 4,5" autocomplete="off" spellcheck="false" />
          <span class="unit" aria-hidden="true">%</span>
        </div>
      </div>
    </div>

    <div class="results" role="region" aria-live="polite" aria-label="Berechnungsergebnisse">
      <div class="result-block" role="button" tabindex="0">
        <div class="label">Entgangene Dividende (Jahr)</div>
        <div class="value zero" id="r-annual">— €</div>
        <span class="sr-only">Zum Kopieren tippen</span>
      </div>
      <div class="result-block" role="button" tabindex="0">
        <div class="label">Entgangener Ertrag (20 Jahre)</div>
        <div class="value zero" id="r-annual20">— €</div>
        <span class="sr-only">Zum Kopieren tippen</span>
      </div>
      <div class="result-block highlight" role="button" tabindex="0">
        <div class="label">Benötigtes Investitionskapital</div>
        <div class="value zero" id="r-wealth">— €</div>
        <span class="sr-only">Zum Kopieren tippen</span>
      </div>
    </div>
    <button class="reset-all" type="button"><span aria-hidden="true">↺</span> Zurücksetzen</button>
  </main>

  <script>
    const YIELD_DEFAULT = '4';

    const priceInput = document.getElementById('price');
    const yieldInput = document.getElementById('yield');
    const resultsDiv = document.querySelector('.results');
    const resetBtn   = document.querySelector('.reset-all');
    const els = {
      annual:   document.getElementById('r-annual'),
      annual20: document.getElementById('r-annual20'),
      wealth:   document.getElementById('r-wealth'),
    };
    const resultEls = Object.values(els);

    const fmt    = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmtInt = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 });

    function parsePrice(str) {
      return parseFloat(str.replace(/\./g, '').replace(',', '.'));
    }

    function parseYield(str) {
      return parseFloat(str.replace(',', '.'));
    }

    function setResult(el, value) {
      const text = value !== null ? fmt.format(value) + ' €' : '— €';
      if (el.textContent !== text) el.textContent = text;
      const zero = value === null;
      if (el.classList.contains('zero') !== zero) el.classList.toggle('zero', zero);
    }

    function setValidity(input, invalid) {
      if (input.classList.contains('invalid') === invalid) return;
      input.classList.toggle('invalid', invalid);
      input.setAttribute('aria-invalid', String(invalid));
    }

    function calculate() {
      const price    = parsePrice(priceInput.value);
      const divYield = parseYield(yieldInput.value);

      const priceOk = isFinite(price)    && price    > 0;
      const yieldOk = isFinite(divYield) && divYield > 0 && divYield <= 100;

      setValidity(priceInput, priceInput.value !== '' && !priceOk);
      setValidity(yieldInput, yieldInput.value !== '' && !yieldOk);

      if (!priceOk || !yieldOk) {
        resultEls.forEach(el => setResult(el, null));
        return;
      }

      const rate   = divYield / 100;
      const annual = price * rate;

      setResult(els.annual,   annual);
      setResult(els.annual20, price * ((1 + rate) ** 20 - 1));
      setResult(els.wealth,   price / rate);
    }

    priceInput.addEventListener('input', () => {
      const cursor  = priceInput.selectionStart;
      const prevLen = priceInput.value.length;

      const raw    = priceInput.value.replace(/[^\d,]/g, '');
      const sep    = raw.indexOf(',');
      const intStr = sep === -1 ? raw  : raw.slice(0, sep);
      const decStr = sep === -1 ? ''   : ',' + raw.slice(sep + 1).replace(/,/g, '');

      priceInput.value = (intStr !== '' ? fmtInt.format(parseInt(intStr, 10)) : '') + decStr;
      const pos = Math.max(0, cursor + (priceInput.value.length - prevLen));
      priceInput.setSelectionRange(pos, pos);

      calculate();
    }, { passive: true });

    yieldInput.addEventListener('input', () => {
      let val = yieldInput.value.replace(/[^\d,.]/g, '');
      const sep = val.search(/[,.]/);
      if (sep !== -1) {
        val = val.slice(0, sep + 1) + val.slice(sep + 1).replace(/[,.]/g, '');
      }
      if (yieldInput.value !== val) yieldInput.value = val;
      calculate();
    }, { passive: true });

    resetBtn.addEventListener('click', () => {
      priceInput.value = '';
      yieldInput.value = YIELD_DEFAULT;
      priceInput.focus();
      calculate();
    }, { passive: true });

    let copiedCount = 0;

    document.querySelectorAll('.result-block').forEach(block => {
      const valueEl = block.querySelector('.value');
      const labelEl = block.querySelector('.label');

      function copy() {
        if (valueEl.classList.contains('zero') || block.classList.contains('copied')) return;
        if (!navigator.clipboard) return;

        const orig = labelEl.textContent;
        navigator.clipboard.writeText(valueEl.textContent).then(() => {
          block.classList.add('copied');
          copiedCount++;
          labelEl.textContent = 'Kopiert ✓';

          setTimeout(() => {
            resultsDiv.setAttribute('aria-live', 'off');
            block.classList.remove('copied');
            labelEl.textContent = orig;
            if (--copiedCount === 0) resultsDiv.setAttribute('aria-live', 'polite');
          }, 1500);
        }).catch(() => {});
      }

      block.addEventListener('click', copy, { passive: true });
      block.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copy(); }
      });
    });

    yieldInput.value = YIELD_DEFAULT;
    calculate();
  </script>
</body>
</html>
